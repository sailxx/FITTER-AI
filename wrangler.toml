# Настройки для запуска через командную строку (npx wrangler deploy).
# Если запускаешь через сайт Cloudflare — этот файл не нужен, смотри SETUP.md
name = "fitter-ai"
main = "worker.js"
compatibility_date = "2026-09-01"

[[kv_namespaces]]
binding = "DB"
id = "7a5f3505aed24657afb0cc924445a9c2"

# Живая синхронизация с приложением Android: на каждого пользователя свой объект с WebSocket-соединениями
[[durable_objects.bindings]]
name = "LIVE"
class_name = "Live"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Live"]

# Логи в Cloudflare (вкладка Observability), помогают искать ошибки
# Расписание:
#   каждые 30 минут — напоминания о воде
#   каждое воскресенье в 17:00 UTC (20:00 по Москве) — ИИ-разбор недели
#   в воскресенье с 17:30 до 21:30 UTC запуски «*/30» добирают тех, кому не хватило лимита разбора
[triggers]
crons = ["*/30 * * * *", "0 17 * * SUN"]

[observability]
enabled = true

[vars]
DAILY_AI_LIMIT = "40"
# GEMINI_MODEL = "gemini-3.5-flash"

# Секреты задаются командами (не храни их в этом файле!):
#   npx wrangler secret put BOT_TOKEN
#   npx wrangler secret put GEMINI_API_KEY
#   npx wrangler secret put WEBHOOK_SECRET
