# Настройки для запуска через командную строку (npx wrangler deploy).
# Если запускаешь через сайт Cloudflare — этот файл не нужен, смотри SETUP.md
name = "fitter-ai"
main = "worker.js"
compatibility_date = "2026-09-01"

[[kv_namespaces]]
binding = "DB"
id = "7a5f3505aed24657afb0cc924445a9c2"

# Логи в Cloudflare (вкладка Observability), помогают искать ошибки
# Расписание: каждое воскресенье в 17:00 UTC (20:00 по Москве) — ИИ-разбор недели
[triggers]
crons = ["0 17 * * 0"]

[observability]
enabled = true

[vars]
DAILY_AI_LIMIT = "40"
# GEMINI_MODEL = "gemini-3.5-flash"

# Секреты задаются командами (не храни их в этом файле!):
#   npx wrangler secret put BOT_TOKEN
#   npx wrangler secret put GEMINI_API_KEY
#   npx wrangler secret put WEBHOOK_SECRET
