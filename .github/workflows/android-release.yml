# Выпуск приложения Fitter для Android: поднять versionCode/versionName в android/app/build.gradle.kts,
# закоммитить и отправить тег:  git tag v3.0.0 && git push origin v3.0.0
# GitHub соберёт, подпишет и опубликует Fitter.apk. Тег, не совпадающий с versionName, сборку не запускает.
name: Android release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # пробный запуск: сборка и подпись без публикации

permissions:
  contents: read

defaults:
  run:
    working-directory: android

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      fingerprint: ${{ steps.signature.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Тег совпадает с versionName
        id: ver
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "v$VER" != "$GITHUB_REF_NAME" ]]; then
            echo "::notice::Тег $GITHUB_REF_NAME — не версия приложения ($VER), APK не собираем"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: steps.ver.outputs.skip != '1'
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        if: steps.ver.outputs.skip != '1'

      - name: Android SDK
        if: steps.ver.outputs.skip != '1'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-37.1 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Ключ подписи из секретов
        if: steps.ver.outputs.skip != '1'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          umask 077
          echo '497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::Нет секрета KEYSTORE_BASE64"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Сборка
        if: steps.ver.outputs.skip != '1'
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: Проверка подписи
        id: signature
        if: steps.ver.outputs.skip != '1'
        run: |
          cp app/build/outputs/apk/release/app-release.apk Fitter.apk
          APKSIGNER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/36.0.0/apksigner"
          SHA=$("$APKSIGNER" verify --print-certs Fitter.apk | grep -oP 'SHA-256 digest: \K\w+')
          [ -n "$SHA" ] || { echo "::error::APK не подписан"; exit 1; }
          [ "$SHA" = "6a8229a5e72aa53171d8999461643651187049e9f4e069078fbb94a8fa192988" ] || { echo "::error::APK подписан чужим ключом: $SHA"; exit 1; }
          echo "fingerprint=$SHA" >> "$GITHUB_OUTPUT"

      - name: Убрать ключ
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" keystore.properties

      - name: APK во вложения
        if: steps.ver.outputs.skip != '1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Fitter.apk
          path: android/Fitter.apk

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') && needs.build.outputs.fingerprint != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Fitter.apk

      - name: Публикация
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VER: ${{ needs.build.outputs.version }}
          SHA: ${{ needs.build.outputs.fingerprint }}
        run: |
          NOTES=$(printf '**Android 8.0+.** Скачайте Fitter.apk, обновите приложение и войдите с одноразовым кодом из @FitterFoodBot. Для управления устройствами используйте `/devices`.\n\nDownload Fitter.apk, update the app, and sign in with a one-time code from @FitterFoodBot. Use `/devices` to manage connected devices.\n\nAPK signing certificate (SHA-256): `%s`' "$SHA")
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" Fitter.apk
          else
            gh release create "$GITHUB_REF_NAME" Fitter.apk --title "Fitter $VER — Android" --generate-notes --latest --notes "$NOTES"
          fi
