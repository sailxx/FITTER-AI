  <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(440 330) scale(460 380)"><stop offset="0" stop-color="#c9f36b" stop-opacity=".12"/><stop offset="1" stop-color="#c9f36b" stop-opacity="0"/></radialGradient>
  <linearGradient id="hero" x1="0" y1="0" x2=".4" y2="1"><stop offset="0" stop-color="#5dffad"/><stop offset=".5" stop-color="#33f792"/><stop offset="1" stop-color="#1fec84"/></linearGradient>
  <linearGradient id="water" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5ab8ff"/><stop offset="1" stop-color="#2a7bf0"/></linearGradient>
  <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a3424"/><stop offset="1" stop-color="#2c1e14"/></linearGradient>
  <clipPath id="card"><rect width="880" height="780" rx="22"/></clipPath>
  <clipPath id="scr"><rect width="300" height="640" rx="40"/></clipPath>
  <clipPath id="pic"><rect width="164" height="112" rx="12"/></clipPath>
</defs>
<g clip-path="url(#card)">
  <rect width="880" height="780" fill="#171916"/>
  <rect width="880" height="780" fill="url(#dots)"/>
  <rect width="880" height="780" fill="url(#glow)"/>
</g>
<rect x=".5" y=".5" width="879" height="779" rx="21.5" fill="none" stroke="#ffffff" stroke-opacity=".07"/>

